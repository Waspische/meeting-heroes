<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Shield Border (Gold Rim) -->
  <path d="M 64 6 
           C 96 6, 118 16, 122 30
           C 122 70, 100 106, 64 124
           C 28 106, 6 70, 6 30
           C 10 16, 32 6, 64 6 Z"
        fill="url(#goldRim)" />

  <!-- Inner Shield (Dark Heroic Night) -->
  <path d="M 64 12 
           C 92 12, 112 21, 116 33
           C 116 67, 96 100, 64 118
           C 32 100, 12 67, 12 33
           C 16 21, 36 12, 64 12 Z"
        fill="url(#shieldGrad)" />

  <!-- Subtle Shield Right Half Shading -->
  <path d="M 64 12 
           L 64 118 
           C 96 100, 116 67, 116 33 
           C 112 21, 92 12, 64 12 Z"
        fill="#ffffff"
        opacity="0.08" />

  <!-- Golden Lightning Bolt -->
  <polygon points="70,22 40,64 62,64 48,106 90,52 68,52"
           fill="url(#boltGrad)"
           filter="url(#heroGlow)" />

  <!-- Sharp Inner Bolt Core -->
  <polygon points="69,27 45,62 64,62 55,95 83,54 67,54"
           fill="#ffffff"
           opacity="0.45" />
</svg>
